

      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
          <title>Image Metadata Viewer</title>
            <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
              <script>
                  document.addEventListener('DOMContentLoaded', function () {
                        document.getElementById('imageInput').addEventListener('change', function(event) {
                                const file = event.target.files[0];
                                        if (!file) return;

                                                const reader = new FileReader();
                                                        reader.onload = function(e) {
                                                                  const img = new Image();
                                                                            img.onload = function() {
                                                                                        EXIF.getData(img, function() {
                                                                                                      const exif = EXIF.getAllTags(this);

                                                                                                                    const output = {
                                                                                                                                      'Phần mềm (Tên app chỉnh sửa)': exif.Software || 'Không hỗ trợ',
                                                                                                                                                        'Ngày và giờ': exif.DateTime || 'Không hỗ trợ',
                                                                                                                                                                          'Hãng máy ảnh': exif.Make || 'Không hỗ trợ',
                                                                                                                                                                                            'Mẫu máy ảnh': exif.Model || 'Not available',
                                                                                                                                                                                                              'Sử dụng Camera': exif.Flash ? 'Có' : 'Không',
                                                                                                                                                                                                                                'Chất lượng ảnh': `${img.width}x${img.height}`,
                                                                                                                                                                                                                                                  'Vị trí (GPS)': (exif.GPSLatitude && exif.GPSLongitude)
                                                                                                                                                                                                                                                                        ? `${exif.GPSLatitude.join(', ')} / ${exif.GPSLongitude.join(', ')}`
                                                                                                                                                                                                                                                                                              : 'Not available',
                                                                                                                                                                                                                                                                                                                'telegram': '@kudo1004'
                                                                                                                                                                                                                                                                                                                              };

                                                                                                                                                                                                                                                                                                                                            let formatted = '';
                                                                                                                                                                                                                                                                                                                                                          for (const [key, value] of Object.entries(output)) {
                                                                                                                                                                                                                                                                                                                                                                            formatted += `${key}: ${value}\n`;
                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('output').textContent = formatted;
                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                              };
                                                                                                                                                                                                                                                                                                                                                                                                                                        img.src = e.target.result;
                                                                                                                                                                                                                                                                                                                                                                                                                                                };
                                                                                                                                                                                                                                                                                                                                                                                                                                                        reader.readAsDataURL(file);
                                                                                                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          body {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                font-family: sans-serif;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      padding: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            background: #f9f9f9;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    #output {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          white-space: pre-wrap;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: #fff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      border: 1px solid #ccc;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            padding: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  margin-top: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <h2>Image Metadata Viewer</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <input type="file" id="imageInput" accept="image/*">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <pre id="output">Upload an image to view details...</pre>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </html>
